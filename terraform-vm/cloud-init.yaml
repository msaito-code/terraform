#cloud-config

package_update: true

packages:
  - curl
  - git
  - wget
  - gnupg
  - ca-certificates
  - apt-transport-https
  - software-properties-common

write_files:

  # -------------------------------------------------------
  # Terraform Azure authentication
  # -------------------------------------------------------

  - path: /etc/profile.d/terraform-azure.sh
    permissions: '0644'
    content: |
      export ARM_USE_MSI=true
      export ARM_CLIENT_ID="${managed_identity_client_id}"
      export ARM_SUBSCRIPTION_ID="${subscription_id}"
      export ARM_TENANT_ID="${tenant_id}"

runcmd:

  # -------------------------------------------------------
  # Install Terraform
  # -------------------------------------------------------

  - wget -O - https://apt.releases.hashicorp.com/gpg | gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg

  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(grep -oP '(?<=UBUNTU_CODENAME=).*' /etc/os-release || lsb_release -cs) main" > /etc/apt/sources.list.d/hashicorp.list

  - apt-get update
  - apt-get install -y terraform


  # -------------------------------------------------------
  # Install Azure CLI
  # -------------------------------------------------------

  - curl -sL https://aka.ms/InstallAzureCLIDeb | bash


  # -------------------------------------------------------
  # Configure Git
  # -------------------------------------------------------

  - su - azureuser -c 'git config --global user.name "${git_name}"'
  - su - azureuser -c 'git config --global user.email "${git_email}"'


  # -------------------------------------------------------
  # Configure SSH directory
  # -------------------------------------------------------

  - mkdir -p /home/azureuser/.ssh
  - chown azureuser:azureuser /home/azureuser/.ssh
  - chmod 700 /home/azureuser/.ssh


  # -------------------------------------------------------
  # Authenticate to Azure with the User Assigned Identity
  # -------------------------------------------------------

  - az login --identity --client-id "${managed_identity_client_id}"


  # -------------------------------------------------------
  # Retrieve GitHub private key from Azure Key Vault
  # -------------------------------------------------------

  - az keyvault secret show --vault-name "${key_vault_name}" --name "github-terraform-private-key" --query value --output tsv > /home/azureuser/.ssh/github_terraform

  - chown azureuser:azureuser /home/azureuser/.ssh/github_terraform
  - chmod 600 /home/azureuser/.ssh/github_terraform


  # -------------------------------------------------------
  # Configure SSH to use the GitHub deploy key
  # -------------------------------------------------------

  - |
    cat > /home/azureuser/.ssh/config <<'EOF'
    Host github.com
        HostName github.com
        User git
        IdentityFile ~/.ssh/github_terraform
        IdentitiesOnly yes
    EOF

  - chown azureuser:azureuser /home/azureuser/.ssh/config
  - chmod 600 /home/azureuser/.ssh/config


  # -------------------------------------------------------
  # Add GitHub to known_hosts
  # -------------------------------------------------------

  - sudo -u azureuser ssh-keyscan github.com >> /home/azureuser/.ssh/known_hosts
  - chown azureuser:azureuser /home/azureuser/.ssh/known_hosts
  - chmod 644 /home/azureuser/.ssh/known_hosts


  # -------------------------------------------------------
  # Clone Terraform repository
  # -------------------------------------------------------

  - sudo -u azureuser git clone "${github_repo}" /home/azureuser/terraform


  # -------------------------------------------------------
  # Verification
  # -------------------------------------------------------

  - terraform version > /var/log/terraform-version.log
  - git --version > /var/log/git-version.log
  - az --version > /var/log/azure-cli-version.log
